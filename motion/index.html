<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知时 · Motion Narrative</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#111827;--muted:#64748b;--line:#e6e9ee;--blue:#4f83ee;--blue2:#dce8ff;--green:#159947;--soft:#f4f6f8}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--bg)}
.grid{position:absolute;inset:0;opacity:.2;background-image:linear-gradient(rgba(15,23,42,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.035) 1px,transparent 1px);background-size:56px 56px;mask-image:linear-gradient(to bottom,transparent 8%,#000 18%,#000 82%,transparent 92%)}
.frame{position:absolute;inset:6%;border:1px solid rgba(15,23,42,.06);border-radius:28px;pointer-events:none}
.header{position:absolute;top:32px;left:42px;right:42px;display:flex;justify-content:space-between;align-items:center;z-index:10;font-size:12px;color:#7b8797}
.header b{color:#111827;font-size:14px;font-weight:700}
.badge{border:1px solid var(--line);background:#fff;padding:7px 10px;border-radius:999px;font-size:10px;color:#64748b}
.scene{position:absolute;inset:0;display:grid;place-items:center}
.hero{
 position:absolute;left:50%;top:50%;
 width:440px;height:300px;border:1px solid #e0e5eb;border-radius:18px;
 background:#fff;box-shadow:0 28px 70px rgba(15,23,42,.13),0 5px 16px rgba(15,23,42,.07);
 transform:translate(-50%,-50%);overflow:hidden;
}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.95);pointer-events:none;z-index:5}
.content{position:absolute;inset:0}
.content.fade{opacity:0}
svg{display:block}
.brand{font-size:16px;font-weight:700;letter-spacing:-.02em}
.mini{font-size:10px;color:#718096}
.label{font-size:12px;font-weight:650}
.muted{font-size:11px;color:#718096}
.rowline{height:1px;background:#edf0f3}
.ring-wrap{position:absolute;inset:0;display:grid;place-items:center}
.ring-value{stroke:var(--blue);stroke-width:8;fill:none;stroke-linecap:round}
.ring-track{stroke:#e8edf3;stroke-width:8;fill:none}
.timer-copy{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;white-space:nowrap}
.big{font-size:27px;font-weight:750;letter-spacing:-.035em}
.tiny{font-size:10px;color:#718096;margin-top:3px}
.head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 13px}
.sites{padding:4px 22px}
.site-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #eef1f4}
.rank{font-size:10px;color:#9aa4b2}.domain{font-size:12px;font-weight:600}.site-time{font-size:11px;color:#657387}
.alert{display:grid;place-items:center;height:100%;text-align:center;padding:28px}
.alert-icon{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;border:1px solid #d8e4fb;background:#f4f7ff;color:var(--blue);font-weight:750;font-size:20px;margin-bottom:15px}
.alert h2{font-size:18px;margin:0 0 5px;letter-spacing:-.02em}.alert p{font-size:11px;color:#718096;margin:0 0 18px}.pill{display:inline-flex;padding:7px 11px;border-radius:999px;background:#172033;color:#fff;font-size:10px}
.focus{padding:22px}.focus-top{display:flex;justify-content:space-between;align-items:center}.focus-time{font-size:40px;font-weight:750;letter-spacing:-.05em;margin-top:45px}.focus-line{height:5px;border-radius:99px;background:#e9edf2;margin-top:20px;overflow:hidden}.focus-line i{display:block;width:61%;height:100%;background:var(--blue);border-radius:inherit}.focus-foot{display:flex;justify-content:space-between;margin-top:9px}
.chartbox{padding:21px}.chart{height:178px;display:flex;align-items:end;gap:12px;margin-top:18px}.bar{flex:1;background:#4f83ee;border-radius:5px 5px 2px 2px;min-width:20px}.axis{display:flex;justify-content:space-between;color:#9aa4b2;font-size:9px;margin-top:8px}
.insight{padding:23px}.insight-number{font-size:48px;font-weight:760;letter-spacing:-.06em;margin-top:16px}.delta{color:var(--green);font-size:11px;font-weight:650;margin-top:2px}.insight-note{margin-top:24px;padding:12px;border:1px solid #e7ebef;border-radius:10px;font-size:11px;line-height:1.6;color:#526174}
.heat{padding:23px}.cells{display:grid;grid-template-columns:repeat(14,14px);gap:5px;margin-top:20px}.cell{width:14px;height:14px;border-radius:3px;background:#eef1f4}.l1{background:#b9d8ff}.l2{background:#7fa9f7}.l3{background:#4f83ee}.l4{background:#172033}
.recover{display:grid;place-items:center;height:100%;text-align:center}.recover-mark{width:58px;height:58px;border-radius:50%;background:#e9f8ee;color:#159947;display:grid;place-items:center;font-size:25px;font-weight:750;margin-bottom:15px}.recover h2{font-size:17px;margin:0 0 5px}.recover p{font-size:11px;color:#718096;margin:0}
.export{padding:23px}.export-card{margin-top:19px;border:1px solid #e6eaf0;border-radius:11px;padding:15px;display:flex;align-items:center;justify-content:space-between}.export-btn{background:#172033;color:#fff;border-radius:8px;padding:9px 14px;font-size:10px}.done{display:grid;place-items:center;height:100%;text-align:center}.done-mark{width:64px;height:64px;border-radius:50%;background:#172033;color:#fff;display:grid;place-items:center;font-size:28px;margin-bottom:15px}.done h2{font-size:18px;margin:0 0 5px}.done p{font-size:11px;color:#718096;margin:0}
.cursor{position:absolute;width:18px;height:18px;z-index:20;pointer-events:none}.cursor:before{content:"";position:absolute;left:1px;top:1px;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:13px solid #111827;transform:rotate(-35deg)}.cursor:after{content:"";position:absolute;left:4px;top:5px;width:4px;height:9px;background:#fff;transform:rotate(-35deg);clip-path:polygon(0 0,100% 0,100% 100%,50% 72%)}
.click{position:absolute;width:22px;height:22px;border:1px solid rgba(79,131,238,.65);border-radius:50%;pointer-events:none;opacity:0}
.controls{position:absolute;z-index:30;left:50%;bottom:27px;transform:translateX(-50%);width:min(620px,calc(100vw - 48px));padding:11px 14px 10px;border:1px solid #dfe4ea;border-radius:13px;background:rgba(255,255,255,.94);box-shadow:0 8px 28px rgba(15,23,42,.08)}
.track{position:relative;height:17px}.trackline{position:absolute;left:0;right:0;top:8px;height:2px;background:#e3e7ec}.progress{position:absolute;left:0;top:8px;height:2px;background:#4f83ee}.knob{position:absolute;top:2px;width:14px;height:14px;border-radius:50%;background:#172033;transform:translateX(-50%);cursor:ew-resize}.meta{display:flex;justify-content:space-between;font-size:9px;color:#8b96a5;margin-top:2px}.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:0;background:transparent;font-size:12px;color:#172033;cursor:pointer}
.hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:9px;color:#98a1ad;white-space:nowrap}
@media(max-width:700px){.header{left:18px;right:18px}.frame{inset:3%}.controls{bottom:18px}.hint{display:none}}
</style>
</head>
<body>
<div class="stage">
 <div class="grid"></div><div class="frame"></div>
 <div class="header"><span><b>知时</b> · motion narrative</span><span class="badge">120 BPM · 7 bars · 14s</span></div>
 <div class="scene">
  <div class="hero" id="hero"><div class="content" id="content"></div></div>
  <div class="cursor" id="cursor"></div><div class="click" id="click"></div>
 </div>
 <div class="controls"><div class="track" id="track"><div class="trackline"></div><div class="progress" id="progress"></div><div class="knob" id="knob"></div></div><div class="meta"><span id="time">00:00.0</span><span>Observe → Intervene → Focus → Reflect → Recover</span><span>00:14.0</span></div><button class="play" id="play">▶</button></div>
 <div class="hint">Space 播放 / 拖动时间轴 · deterministic seek(t)</div>
</div>
<script>
const BPM=120,BEAT=.5,BARS=7,DURATION=BARS*4*BEAT;
const $=id=>document.getElementById(id),hero=$('hero'),content=$('content'),cursor=$('cursor'),click=$('click'),progress=$('progress'),knob=$('knob'),track=$('track'),play=$('play'),timeEl=$('time');
const states=[
 {name:'Observe',w:440,h:300,r:18,type:'observe'},
 {name:'Timer',w:280,h:280,r:140,type:'timer'},
 {name:'Sites',w:550,h:330,r:18,type:'sites'},
 {name:'Alert',w:350,h:270,r:135,type:'alert'},
 {name:'Focus',w:520,h:300,r:18,type:'focus'},
 {name:'Chart',w:580,h:340,r:18,type:'chart'},
 {name:'Insight',w:430,h:310,r:18,type:'insight'},
 {name:'Heatmap',w:470,h:300,r:18,type:'heat'},
 {name:'Recover',w:330,h:270,r:135,type:'recover'},
 {name:'Export',w:450,h:260,r:18,type:'export'},
 {name:'Done',w:280,h:280,r:140,type:'done'},
 {name:'Observe',w:440,h:300,r:18,type:'observe'}
];
const events=[{beat:0,state:0},{beat:2,state:1},{beat:4,state:2},{beat:6,state:3},{beat:8,state:4},{beat:10,state:5},{beat:12,state:6},{beat:14,state:7},{beat:16,state:8},{beat:18,state:9},{beat:20,state:10},{beat:22,state:11}];
const cursorTargets=[[0.69,.67],[.65,.72],[.76,.53],[.67,.67],[.73,.62],[.76,.72],[.66,.58],[.75,.7],[.67,.67],[.74,.65],[.62,.64],[.69,.67]];
function resp(dt,w=13,z=.78){if(dt<=0)return 0;const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*dt)*(Math.cos(wd*dt)+(z*w/wd)*Math.sin(wd*dt))}
function prop(t,key,def){let v=def,p=def;for(const e of events){const at=e.beat*BEAT;if(at>t)break;const target=states[e.state][key],d=target-p;v+=d*resp(t-at);p=target}return v}
function stateAt(t){let s=0;for(const e of events){if(e.beat*BEAT<=t)s=e.state;else break}return s}
function render(type){
 if(type==='observe')return '<div class="head"><span class="brand">知时</span><span class="mini">注意力与健康</span></div><div class="ring-wrap"><svg width="172" height="172" viewBox="0 0 172 172"><circle class="ring-track" cx="86" cy="86" r="73"/><circle class="ring-value" cx="86" cy="86" r="73" stroke-dasharray="459" stroke-dashoffset="176"/></svg><div class="timer-copy"><div class="big">2h 41m</div><div class="tiny">今日使用</div></div></div>';
 if(type==='timer')return '<div class="ring-wrap"><svg width="190" height="190" viewBox="0 0 190 190"><circle class="ring-track" cx="95" cy="95" r="81"/><circle class="ring-value" cx="95" cy="95" r="81" stroke-dasharray="509" stroke-dashoffset="178"/></svg><div class="timer-copy"><div class="big">41:35</div><div class="tiny">今天已经过去的屏幕时间</div></div></div>';
 if(type==='sites')return '<div class="head"><span class="label">时间去哪了</span><span class="mini">今天 · 实时</span></div><div class="sites"><div class="site-row"><span class="rank">01</span><span class="domain">bilibili.com</span><span class="site-time">1h 27m</span></div><div class="site-row"><span class="rank">02</span><span class="domain">github.com</span><span class="site-time">42m</span></div><div class="site-row"><span class="rank">03</span><span class="domain">linux.do</span><span class="site-time">31m</span></div><div class="site-row"><span class="rank">04</span><span class="domain">google.com</span><span class="site-time">18m</span></div></div>';
 if(type==='alert')return '<div class="alert"><div class="alert-icon">27m</div><h2>bilibili 正在吃掉你的时间</h2><p>过去 30 分钟连续观看，没有进入学习任务。</p><span class="pill">设置今日上限</span></div>';
 if(type==='focus')return '<div class="focus"><div class="focus-top"><span class="brand">专注模式</span><span class="mini">Bilibili 已暂停</span></div><div class="focus-time">24:18</div><div class="focus-line"><i></i></div><div class="focus-foot"><span class="muted">当前任务 · English</span><span class="muted">61%</span></div></div>';
 if(type==='chart')return '<div class="chartbox"><div class="head" style="padding:0"><span class="label">改变正在发生</span><span class="mini">近 7 天</span></div><div class="chart"><i class="bar" style="height:35%"></i><i class="bar" style="height:51%"></i><i class="bar" style="height:43%"></i><i class="bar" style="height:68%"></i><i class="bar" style="height:55%"></i><i class="bar" style="height:81%"></i><i class="bar" style="height:92%"></i></div><div class="axis"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div></div>';
 if(type==='insight')return '<div class="insight"><span class="label">本周洞察</span><div class="insight-number">−34%</div><div class="delta">无目的浏览时间</div><div class="insight-note">你没有减少上网，而是减少了“打开以后不知道为什么”的时间。</div></div>';
 if(type==='heat'){let cells='';for(let i=0;i<84;i++){let n=(i*11+5)%17;cells+='<i class="cell '+(n>14?'l4':n>10?'l3':n>6?'l2':n>2?'l1':'')+'"></i>'}return '<div class="heat"><span class="label">你的注意力地图</span><div class="cells">'+cells+'</div><span class="mini">越深 = 越长时间保持专注</span></div>'}
 if(type==='recover')return '<div class="recover"><div><div class="recover-mark">✓</div><h2>该休息一下了</h2><p>连续专注 24 分钟 · 现在离开屏幕 20 秒</p></div></div>';
 if(type==='export')return '<div class="export"><span class="label">把一天带走</span><span class="mini">所有数据保存在本机</span><div class="export-card"><div><div class="label">今日时间线</div><div class="mini">2h 41m · 12 个站点</div></div><span class="export-btn">导出 CSV</span></div></div>';
 return '<div class="done"><div><div class="done-mark">✓</div><h2>今天，掌控回来了</h2><p>知时只告诉你发生了什么，决定权一直在你手里。</p></div></div>';
}
function cursorAt(t){const p=t/(DURATION)*(cursorTargets.length-1),i=Math.min(cursorTargets.length-2,Math.floor(p)),f=p-i;return[(cursorTargets[i][0]+(cursorTargets[i+1][0]-cursorTargets[i][0])*f)*window.innerWidth,(cursorTargets[i][1]+(cursorTargets[i+1][1]-cursorTargets[i][1])*f)*window.innerHeight]}
function seek(t){
 t=Math.max(0,Math.min(DURATION,t));if(t>=DURATION)t=0;
 const s=states[stateAt(t)];
 hero.style.width=prop(t,'w',states[0].w)+'px';hero.style.height=prop(t,'h',states[0].h)+'px';hero.style.borderRadius=prop(t,'r',states[0].r)+'px';
 let active=0;for(const e of events){if(e.beat*BEAT<=t)active=e.beat*BEAT;else break}
 const local=t-active,swap=Math.min(1,Math.max(0,(local-.08)/.16));
 content.style.opacity=local<.08?1:Math.max(.88,swap);
 content.style.filter='none';
 if(content.dataset.type!==s.type){content.innerHTML=render(s.type);content.dataset.type=s.type}
 const [cx,cy]=cursorAt(t);cursor.style.left=cx+'px';cursor.style.top=cy+'px';
 const phase=(t/BEAT)%2;click.style.left=(cx-2)+'px';click.style.top=(cy-2)+'px';click.style.opacity=phase<.10?String(1-phase/.10):'0';
 const pct=t/DURATION*100;progress.style.width=pct+'%';knob.style.left=pct+'%';timeEl.textContent='00:'+(t<10?'0':'')+t.toFixed(1);
}
let playing=false,offset=0,last=0;
function toggle(){playing=!playing;play.textContent=playing?'Ⅱ':'▶';if(playing){last=performance.now();requestAnimationFrame(loop)}}
function loop(now){if(!playing)return;offset+=(now-last)/1000;last=now;if(offset>=DURATION)offset=0;seek(offset);requestAnimationFrame(loop)}
function setFromPointer(e){const r=track.getBoundingClientRect();offset=Math.max(0,Math.min(DURATION,(e.clientX-r.left)/r.width*DURATION));seek(offset)}
play.addEventListener('click',toggle);track.addEventListener('pointerdown',e=>{setFromPointer(e);const move=x=>setFromPointer(x),up=()=>{removeEventListener('pointermove',move);removeEventListener('pointerup',up)};addEventListener('pointermove',move);addEventListener('pointerup',up)});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle()}});
seek(0);
</script>
</body>
</html>
