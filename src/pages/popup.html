<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="theme-boot.js"></script>
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="popup.css" />
    <title>知时</title>
  </head>
  <body>
    <main class="popup">
      <header class="popup-head">
        <div class="brand-row">
          <div class="brand">
            <span class="brand-name" data-i18n="brandName">知时</span>
          </div>
          <div class="segmented lang-mini" role="group" aria-label="Language" id="popupLocale">
            <button class="segment" type="button" data-locale="zh">中</button>
            <button class="segment" type="button" data-locale="en">EN</button>
          </div>
          <div class="segmented lang-mini" role="group" aria-label="Theme" id="popupTheme">
            <button class="segment" type="button" data-theme="light" data-i18n-aria="themeLight" aria-label="浅色"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button>
            <button class="segment" type="button" data-theme="dark" data-i18n-aria="themeDark" aria-label="暗色"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
          </div>
        </div>
        <p class="status muted" id="status">…</p>
      </header>

      <section class="today" id="todaySection">
        <div class="today-ring" id="ringWrap" hidden>
          <svg width="104" height="104" viewBox="0 0 104 104" aria-hidden="true">
            <circle class="ring-track" cx="52" cy="52" r="46" />
            <circle class="ring-value" id="ringValue" cx="52" cy="52" r="46" />
          </svg>
          <div class="ring-center">
            <span class="today-big num" id="todayTotal">0 分钟</span>
            <span class="ring-caption muted" id="ringCaption"></span>
          </div>
        </div>
        <div class="today-plain" id="plainWrap" hidden>
          <span class="today-big num" id="todayTotalPlain">0 分钟</span>
          <span class="muted" id="todayCaption" data-i18n="todayLabel">今日使用</span>
        </div>
      </section>

      <section class="sites">
        <div class="sites-head">
          <h2 class="section-label" data-i18n="topSites">网站排行</h2>
          <label class="merge-toggle" title="按根域名合并" data-i18n-title="mergeByRootHint">
            <span class="muted" data-i18n="mergeByRoot">按根域名合并</span>
            <button class="switch" role="switch" id="siteMerge" aria-label="按根域名合并" data-i18n-aria="mergeByRootHint"></button>
          </label>
        </div>
        <div id="siteList"></div>
      </section>

      <section class="toggles">
        <div class="toggle-row">
          <div class="toggle-text">
            <span id="eyeLabel" data-i18n="eyeRest">护眼提醒</span>
            <span class="muted toggle-sub" id="eyeSub">每 20 分钟望向远处</span>
          </div>
          <button class="switch" role="switch" id="eyeSwitch" aria-label="护眼提醒" data-i18n-aria="eyeRest"></button>
        </div>
        <div class="toggle-row">
          <div class="toggle-text">
            <span id="limitLabel" data-i18n="siteLimits">网站限额</span>
            <span class="muted toggle-sub" id="limitSub">达到限额后拦截</span>
          </div>
          <button class="switch" role="switch" id="limitSwitch" aria-label="网站限额" data-i18n-aria="siteLimits"></button>
        </div>
        <div class="toggle-row">
          <div class="toggle-text">
            <span id="focusLabel" data-i18n="focusTitle">专注模式</span>
            <span class="muted toggle-sub" id="focusSub">仅白名单站点可访问</span>
          </div>
          <button class="switch" role="switch" id="focusSwitch" aria-label="专注模式" data-i18n-aria="focusTitle"></button>
        </div>
      </section>

      <footer class="popup-foot">
        <a href="dashboard.html" id="dashLink" class="btn btn-outline btn-sm" data-i18n="openDashboard">打开仪表盘</a>
      </footer>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
